# Builds and tests ORBIT, and publishes releases (see docs/RELEASING.md).
#
#   push to main / pull request      -> tests (Linux), then the Windows build and its checks
#   "Run workflow" with "Publish a release" ticked, or a v* tag
#                                    -> the same, then a GitHub release with every file,
#                                       which SourceForge's GitHub integration copies
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the version in package.json"
        type: boolean
        default: false

permissions:
  contents: write # only used by the release job

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # not needed for unit tests
      - name: Typecheck
        run: npx tsc -b
      - name: Unit tests
        run: npm test

  build-windows:
    name: Windows builds
    needs: test
    runs-on: windows-latest
    steps:
      # The repository's own line endings, so the source zip matches the repository.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Installer, portable exe, single-file edition, source zip, README, checksums
        run: npm run release
      - name: Release checks (the desktop app keeps data between launches; the single file runs from disk)
        run: npm run e2e:release
      - name: Smoke-run the packaged app
        shell: pwsh
        run: |
          # The built exe must open a window and create its storage, then it is closed.
          $data = Join-Path $env:RUNNER_TEMP "orbit-smoke"
          $env:ORBIT_USER_DATA = $data
          $p = Start-Process -FilePath "release\win-unpacked\ORBIT.exe" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              Start-Sleep -Milliseconds 500
              $ok = Test-Path (Join-Path $data "IndexedDB")
            }
            if (-not $ok) { throw "the packaged app did not open its storage within 30 s" }
            if ($p.HasExited) { throw "the packaged app exited early (code $($p.ExitCode))" }
            "packaged app started and opened its storage"
          } finally {
            Get-Process -Name ORBIT -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Upload the release folder
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-release
          path: release/sourceforge/
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ORBIT-release
          path: out
      - name: Version, notes and files
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $ver in package.json"; exit 1
          fi
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "::error::release v$ver already exists; bump the version"; exit 1
          fi
          if [ ! -f "RELEASE-NOTES-$ver.md" ]; then
            echo "::error::RELEASE-NOTES-$ver.md is missing; it is the release's body"; exit 1
          fi
          ls -l "out/$ver"
          (cd "out/$ver" && sha256sum -c SHA256SUMS.txt)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      # A draft first, with every file on it, then published: SourceForge's GitHub integration
      # copies a release when it is published and does not see files added afterwards.
      # Publishing creates the tag at this commit.
      - name: Create the release as a draft, with every file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ORBIT ${{ steps.v.outputs.version }}
          body_path: RELEASE-NOTES-${{ steps.v.outputs.version }}.md
          draft: true
          files: out/${{ steps.v.outputs.version }}/*
          fail_on_unmatched_files: true
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ steps.v.outputs.version }}" --draft=false --latest
